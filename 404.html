<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="404 - Page Not Found">
    <title>404 - Page Not Found | Elements of Taste</title>
    <link rel="icon" href="./Assets/bg remove.webp">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Variables - Matching the root theme */
        :root {
            --primary-color: #D4AF37;
            --primary-dark: #b5952f;
            --bg-color: #0A0A0A;
            --surface-color: #141414;
            --text-main: #FDFDFD;
            --text-muted: #A0A0A0;
            --border-color: rgba(255, 255, 255, 0.1);
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
        }

        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Effect */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(20, 20, 20, 1) 0%, rgba(10, 10, 10, 1) 100%);
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* Grid Pattern */
        .grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* Main Container */
        .error-container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 10;
            max-width: 800px;
        }

        /* Floating Icons Background */
        .floating-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .float-icon {
            position: absolute;
            font-size: 2rem;
            color: rgba(212, 175, 55, 0.15);
            animation: float 15s infinite ease-in-out;
        }

        .float-icon:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .float-icon:nth-child(2) { top: 20%; right: 15%; animation-delay: 2s; font-size: 1.5rem; }
        .float-icon:nth-child(3) { top: 60%; left: 8%; animation-delay: 4s; }
        .float-icon:nth-child(4) { top: 80%; right: 10%; animation-delay: 1s; font-size: 2.5rem; }
        .float-icon:nth-child(5) { top: 40%; left: 5%; animation-delay: 3s; font-size: 1.2rem; }
        .float-icon:nth-child(6) { top: 15%; right: 25%; animation-delay: 5s; }
        .float-icon:nth-child(7) { top: 70%; left: 20%; animation-delay: 2.5s; font-size: 1.8rem; }
        .float-icon:nth-child(8) { top: 35%; right: 5%; animation-delay: 3.5s; font-size: 1.3rem; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.15;
            }
            25% {
                transform: translateY(-20px) rotate(5deg);
                opacity: 0.25;
            }
            50% {
                transform: translateY(-10px) rotate(-3deg);
                opacity: 0.2;
            }
            75% {
                transform: translateY(-25px) rotate(8deg);
                opacity: 0.3;
            }
        }

        /* 404 Number */
        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(8rem, 20vw, 18rem);
            font-weight: 700;
            line-height: 1;
            color: var(--primary-color);
            text-shadow: 
                0 0 40px rgba(212, 175, 55, 0.5),
                0 0 80px rgba(212, 175, 55, 0.3),
                0 0 120px rgba(212, 175, 55, 0.1);
            animation: glowPulse 3s ease-in-out infinite, floatText 6s ease-in-out infinite;
            position: relative;
            display: inline-block;
        }

        @keyframes glowPulse {
            0%, 100% {
                text-shadow: 
                    0 0 40px rgba(212, 175, 55, 0.5),
                    0 0 80px rgba(212, 175, 55, 0.3),
                    0 0 120px rgba(212, 175, 55, 0.1);
            }
            50% {
                text-shadow: 
                    0 0 60px rgba(212, 175, 55, 0.7),
                    0 0 100px rgba(212, 175, 55, 0.5),
                    0 0 150px rgba(212, 175, 55, 0.3);
            }
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Decorative Lines */
        .error-code::before,
        .error-code::after {
            content: '';
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            width: 150px;
            animation: lineExpand 2s ease-out forwards;
        }

        .error-code::before {
            top: 50%;
            right: 100%;
            transform: translateY(-50%);
            margin-right: 20px;
        }

        .error-code::after {
            top: 50%;
            left: 100%;
            transform: translateY(-50%);
            margin-left: 20px;
        }

        @keyframes lineExpand {
            0% { width: 0; opacity: 0; }
            100% { width: 150px; opacity: 1; }
        }

        /* Error Title */
        .error-title {
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            animation: fadeInUp 1s ease 0.3s backwards;
        }

        /* Error Description */
        .error-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 2.5rem;
            line-height: 1.8;
            animation: fadeInUp 1s ease 0.5s backwards;
        }

        /* Decorative Divider */
        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            margin: 0 auto 2.5rem;
            animation: fadeInUp 1s ease 0.4s backwards;
        }

        /* Button Container */
        .btn-container {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 1s ease 0.7s backwards;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-family: var(--font-body);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: 2px solid var(--primary-color);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--text-main);
            transform: translateY(-3px);
        }

        /* Particles Canvas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* Food Icon Animation */
        .food-icon {
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Additional decorative elements */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }

        .sparkle:nth-child(1) { top: 20%; left: 20%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 30%; right: 30%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { bottom: 30%; left: 25%; animation-delay: 1s; }
        .sparkle:nth-child(4) { bottom: 20%; right: 20%; animation-delay: 1.5s; }

        @keyframes sparkle {
            0%, 100% { 
                opacity: 0; 
                transform: scale(0); 
            }
            50% { 
                opacity: 1; 
                transform: scale(1); 
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-code {
                font-size: clamp(5rem, 25vw, 10rem);
            }

            .error-code::before,
            .error-code::after {
                display: none;
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 280px;
                justify-content: center;
            }
        }

        /* Animation Classes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 1s ease forwards;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }
    </style>
</head>

<body>
    <!-- Background Effects -->
    <div class="bg-overlay"></div>
    <div class="grid-pattern"></div>

    <!-- Floating Icons -->
    <div class="floating-icons">
        <div class="float-icon"><i class="fas fa-utensils"></i></div>
        <div class="float-icon"><i class="fas fa-wine-glass"></i></div>
        <div class="float-icon"><i class="fas fa-hat-chef"></i></div>
        <div class="float-icon"><i class="fas fa-mug-hot"></i></div>
        <div class="float-icon"><i class="fas fa-burger"></i></div>
        <div class="float-icon"><i class="fas fa-utensils"></i></div>
        <div class="float-icon"><i class="fas fa-glass-cheers"></i></div>
        <div class="float-icon"><i class="fas fa-pepper-hot"></i></div>
    </div>

    <!-- Sparkles -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <!-- Particles Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Main Error Content -->
    <div class="error-container">
        <div class="error-code">
            404
        </div>
        
        <h1 class="error-title">Oops! Something Went Wrong</h1>
        
        <div class="divider"></div>
        
        <p class="error-desc">
            It seems the page you're looking for has wandered off our menu. 
            Perhaps it was temporarily unavailable or maybe you've found a secret dish that doesn't exist!
            <span class="food-icon"><i class="fas fa-pizza-slice"></i></span>
        </p>
        
        <div class="btn-container">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i>
                Back to Home
            </a>
            <a href="#contact" class="btn btn-outline" onclick="history.back()">
                <i class="fas fa-arrow-left"></i>
                Go Back
            </a>
        </div>
    </div>

    <script>
        // Particle System
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        const particleCount = 50;
        
        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Particle class
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.color = Math.random() > 0.5 ? '212, 175, 55' : '255, 255, 255';
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Wrap around
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
                ctx.fill();
            }
        }
        
        // Initialize particles
        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            // Draw connections
            particles.forEach((p1, i) => {
                particles.slice(i + 1).forEach(p2 => {
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(212, 175, 55, ${0.1 * (1 - distance / 150)})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                });
            });
            
            requestAnimationFrame(animate);
        }
        
        initParticles();
        animate();
        
        // Mouse interaction
        let mouse = { x: null, y: null };
        
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        
        canvas.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });
        
        // Add hover effect on particles near mouse
        setInterval(() => {
            if (mouse.x && mouse.y) {
                particles.forEach(particle => {
                    const dx = mouse.x - particle.x;
                    const dy = mouse.y - particle.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 100) {
                        particle.opacity = Math.min(1, particle.opacity + 0.05);
                        particle.size = Math.min(4, particle.size + 0.1);
                    } else {
                        particle.opacity = Math.max(0.1, particle.opacity - 0.01);
                        particle.size = Math.max(0.5, particle.size - 0.05);
                    }
                });
            }
        }, 50);
        
        // Parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const floatingIcons = document.querySelectorAll('.float-icon');
            const moveX = (e.clientX - window.innerWidth / 2) * 0.02;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.02;
            
            floatingIcons.forEach((icon, index) => {
                const speed = (index + 1) * 0.5;
                icon.style.transform = `translate(${moveX * speed}px, ${moveY * speed}px)`;
            });
        });
        
        // Console message for fun
        // console.log('%c🍽️ 404 - Even the chef couldn't find this page!', 'color: #D4AF37; font-size: 16px; font-family: sans-serif;');
        // console.log('%cWelcome to Elements of Taste - Where flavors come alive!', 'color: #A0A0A0; font-size: 12px; font-family: sans-serif;');
    </script>
</body>

</html>
